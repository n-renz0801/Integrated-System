{% extends "base.html" %} {% block title %}OPCRF Part II -
Project-MEASURE-School{% endblock %} {% block content %}

<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/eopcrf2.css') }}"
/>
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/eopcrf2_print.css') }}"
/>

<section id="eopcrf2-tab" class="tab-panel eopcrf2-panel">
  <!-- Header: title and actions in one card -->
  <div class="eopcrf2-header">
    <div class="eopcrf2-header-top">
      <div class="eopcrf2-header-title-main">
        <span class="eopcrf2-header-badge">OPCRF II</span>
        <div>
          <h2>Leadership and Core Behavioral Competencies</h2>
        </div>
      </div>
      <div class="eopcrf2-header-actions">
        <button type="button" id="eopcrf2-print-btn" class="eopcrf2-pdf-btn">
          <i class="ti ti-file-type-pdf" aria-hidden="true"></i> Save to PDF
        </button>
        <button type="button" class="eopcrf2-reset-btn" id="eopcrf2-reset-btn">
          <i class="ti ti-refresh-alert" aria-hidden="true"></i> Reset Data
        </button>
      </div>
    </div>
  </div>

  <!-- Overall progress: one segment per competency (click to jump). -->
  <div class="eopcrf2-progress" id="eopcrf2-progress">
    <div class="eopcrf2-progress-summary">
      <span
        class="eopcrf2-progress-count"
        id="eopcrf2-progress-count"
        title="A competency is complete when all five indicators are rated"
      ></span>
    </div>
    <div
      class="eopcrf2-segments"
      id="eopcrf2-segments"
      role="progressbar"
      aria-label="Overall progress"
      aria-valuemin="0"
      aria-valuemax="9"
      aria-valuenow="0"
    ></div>
    <button type="button" class="eopcrf2-next-btn" id="eopcrf2-next-incomplete">
      <i class="ti ti-player-skip-forward" aria-hidden="true"></i> Next
      incomplete
    </button>
    <span class="eopcrf2-done-badge" id="eopcrf2-done-badge" hidden>
      <i class="ti ti-circle-check" aria-hidden="true"></i> Form complete
    </span>
  </div>

  <div id="eopcrf2-workspace" class="eopcrf2-workspace">
    <div class="eopcrf2-nav-col">
      <!-- A div, not <nav>: base.css styles bare nav/header elements. -->
      <div
        id="eopcrf2-list"
        class="eopcrf2-list"
        role="navigation"
        aria-label="Competencies"
      ></div>
    </div>
    <div id="eopcrf2-editor" class="eopcrf2-editor"></div>
  </div>
</section>

<!-- ================= RESET CONFIRMATION MODAL ================= -->
<div id="eopcrf2-reset-confirm-overlay" class="eopcrf2-confirm-overlay">
  <div class="eopcrf2-confirm-box" role="dialog" aria-modal="true">
    <h4>Reset this form?</h4>
    <p class="eopcrf2-reset-intro">
      This clears every rating in Part II-A and Part II-B. This cannot be
      undone.
    </p>
    <div class="eopcrf2-confirm-actions">
      <button
        type="button"
        id="eopcrf2-reset-confirm-cancel"
        class="eopcrf2-btn"
      >
        Cancel
      </button>
      <button
        type="button"
        id="eopcrf2-reset-confirm-confirm"
        class="eopcrf2-btn eopcrf2-btn--danger"
      >
        Yes, reset
      </button>
    </div>
  </div>
</div>

<!-- Print-only copy of the form; built and moved to <body> by eopcrf2.js -->
<div id="eopcrf2-print-root"></div>

<script src="{{ url_for('static', filename='js/eopcrf2.js') }}"></script>

{% endblock %}
